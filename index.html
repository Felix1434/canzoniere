<title>Canzoniere</title>
<style>
:root{--lbg:#fbfaf7;--lfg:#1d1d1f;--lmut:#6e6c68;--lcard:#fff;--lline:#e4e0d8;--lacc:#b3261e}
@media (prefers-color-scheme:dark){:root{--lbg:#131313;--lfg:#ececea;--lmut:#9a9893;--lcard:#1d1d1d;--lline:#323230;--lacc:#ff8f7f}}
body.lock{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--lbg);color:var(--lfg);
  font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:0 16px}
#f{width:min(360px,100%);background:var(--lcard);border:1px solid var(--lline);border-radius:18px;padding:26px 22px}
#f[hidden]{display:none}
#f h1{margin:0 0 4px;font-size:26px}
#f p{margin:0 0 18px;color:var(--lmut);font-size:15px}
#f input{width:100%;box-sizing:border-box;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--lline);background:var(--lbg);color:var(--lfg);outline:none}
#f input:focus{border-color:var(--lacc)}
#f button{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:12px;border-radius:12px;border:0;background:var(--lacc);color:#fff}
#err{color:var(--lacc);font-size:14px;min-height:1.4em;margin-top:10px}
</style>
</head>
<body class="lock">
<form id="f" hidden>
  <h1>Canzoniere</h1>
  <p>Inserisci la password. Questo dispositivo se la ricorderà.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus>
  <button type="submit" id="go">Apri</button>
  <div id="err"></div>
</form>

const un64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const to64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
async function derive(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({ name:'PBKDF2', salt: un64(P.salt), iterations: P.iter, hash:'SHA-256' }, base, 256);
}
async function open(raw){
  const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: un64(P.iv) }, k, un64(P.ct));
  const html = new TextDecoder().decode(pt);
  document.querySelectorAll('style,link').forEach(x => x.remove());
  document.open(); document.write(html); document.close();
}
function getKey(){ try{ return localStorage.getItem('cz-key'); }catch(e){ return null; } }
function setKey(v){ try{ v ? localStorage.setItem('cz-key', v) : localStorage.removeItem('cz-key'); }catch(e){} }

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

(async () => {
  const saved = getKey();
  if (saved){ try{ await open(un64(saved)); return; }catch(e){ setKey(null); } }
  const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
  f.hidden = false; document.getElementById('pw').focus();
  f.addEventListener('submit', async e => {
    e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = 'Controllo…';
    try{
      const raw = await derive(document.getElementById('pw').value);
      await open(raw); setKey(to64(raw));
    }catch(x){ err.textContent = 'Password sbagliata.'; go.disabled = false; go.textContent = 'Apri'; }
  });
})();
